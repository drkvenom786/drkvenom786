<svg width="854" height="220" viewBox="0 0 854 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F" />
      <stop offset="50%" stop-color="#181818" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E6E6E6" />
      <stop offset="100%" stop-color="#CCCCCC" />
    </linearGradient>
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="854" height="220" rx="12" fill="url(#bg)" stroke="#262626" stroke-width="1.5" />

  <!-- Abstract Waving Paths -->
  <path d="M0 130 Q 213.5 170 427 140 T 854 165 L 854 220 L 0 220 Z" fill="#141414" opacity="0.8" />
  <path d="M0 155 Q 213.5 125 427 160 T 854 140 L 854 220 L 0 220 Z" fill="#1F1F1F" opacity="0.6" />

  <!-- Glowing Accent Line -->
  <path d="M 80 165 Q 427 125 774 165" stroke="url(#lineGradient)" stroke-width="2.5" fill="none" filter="url(#glow)" opacity="0.9" />

  <!-- Main Title: V E N O M -->
  <text x="50%" y="40%" text-anchor="middle" dominant-baseline="middle" fill="url(#textGradient)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="14">V E N O M</text>

  <!-- Subtitle -->
  <text x="50%" y="68%" text-anchor="middle" dominant-baseline="middle" fill="#A3A3A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="2">Building clean, functional, modern software</text>
</svg>